# Installed by tunforge install.sh -> /etc/systemd/resolved.conf.d/tunforge.conf
#
# Goals:
#   - Keep the stub listener on 127.0.0.53 so /etc/resolv.conf stays simple and
#     tunforge can install per-link routing domains via resolvectl.
#   - Disable single-label, mDNS and LLMNR resolution so the host never broadcasts
#     its name onto the LAN while a VPN is up (Google et al. cannot fingerprint
#     local hostname this way).

[Resolve]
DNSStubListener=yes
ResolveUnicastSingleLabel=no
LLMNR=no
MulticastDNS=no
Cache=yes
DNSSEC=allow-downgrade
ReadEtcHosts=yes
