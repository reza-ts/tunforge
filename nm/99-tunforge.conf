# Installed by tunforge install.sh -> /etc/NetworkManager/conf.d/99-tunforge.conf
#
# Goals:
#   1. Force NetworkManager to delegate DNS to systemd-resolved (no /etc/resolv.conf
#      thrashing).
#   2. Mark VPN-related interfaces (wg*, tun*, tunforge-*, tun-opus*) as unmanaged so
#      NM never touches their addresses, routes, or DNS while the tunforge TUI owns
#      them.
#   3. Use rc-manager=symlink so /etc/resolv.conf stays a stable symlink to the
#      systemd-resolved stub.

[main]
dns=systemd-resolved
rc-manager=symlink
systemd-resolved=true

[keyfile]
unmanaged-devices=interface-name:wg*;interface-name:tun*;interface-name:tunforge-*;interface-name:tun-opus*

[connection]
# Keep IPv6 strictly opt-in per-connection. Defaults to "auto" otherwise, which
# can leak link-local DNS / SLAAC even when our profile disables IPv6 globally.
ipv6.ip6-privacy=2
